<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My JS Resume</title>
    <style>
      body {
        background-color: black;
        text-align: center;
        font-size: 25px;
        color: white;
      }
      #date {
        font-size: 10px;
        color: white;
        position: fixed;
        bottom: 10px; /* 10 px from the bottom */
        left: 0; /* centered */
        right: 0;
        margin: 0; /* Removes default spacing */
      }
      /* Default */
      button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 18px;
        cursor: pointer;
        background-color: white;
        color: black;
        border: 2px solid white;
        transition:
          background-color 0.2s,
          color 0.2s; /* Smooth transition effect */
      }

      /* Hover */
      button:hover {
        background-color: black;
        color: white;
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 1. Grab the user's current live system date
        const today = new Date();

        // 2. Automatically format it into a localized string (e.g., MM/DD/YYYY)
        const formattedDate = today.toLocaleDateString();

        // 3. Find the element and replace the text content
        document.getElementById("date").textContent = "As of " + formattedDate;
      });
    </script>
  </head>
  <body>
    <h1 style="color: white">Welcome Earthling</h1>
    <h2 style="color: white">This is my Resume. Have Fun!</h2>
    <a href="about.html" class="btn"><button>About Me</button></a>
    <a href="skills.html" class="btn"><button>Skills</button></a>
    <a href="projects.html" class="btn"><button>Projects</button></a>
    <a href="interests.html" class="btn"><button>Interests</button></a>
    <a href="contact.html" class="btn"><button>Contact</button></a>
    <p id="date">As of 10/4/2026</p>
  </body>
</html>
